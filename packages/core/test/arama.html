<!doctype html>
<html lang="tr">
<meta charset="utf-8">
<title>TRDS arama güvenlik testi</title>
<h1>Arama güvenlik testi</h1>
<p id="sonuc" role="status">Test çalışıyor.</p>
<div id="sahne"></div>
<script type="module">
  const sonuc = document.getElementById('sonuc');
  const sahne = document.getElementById('sahne');
  const gecersiz = ['javascript:void(window.calisti=true)', 'JaVaScRiPt:void(window.calisti=true)', 'java\nscript:void(window.calisti=true)', 'data:text/html,<h1>test</h1>', 'vbscript:msgbox(1)'];
  const bekle = () => new Promise((tamam) => setTimeout(tamam, 30));
  let toplam = 0;
  try {
    for (const dosya of ['trds.js', 'trds.min.js']) {
      const { aramaBaslat } = await import(`../dist/${dosya}`);
      for (const adres of gecersiz) {
        for (const yol of ['klavye', 'fare']) {
          sahne.innerHTML = '<div data-trds="arama" data-kaynak-id="veri"><form><label for="sorgu">Arama</label><input id="sorgu" role="combobox"><div role="listbox" hidden></div><p data-trds-durum></p></form></div><script id="veri" type="application/json"><\/script>';
          document.getElementById('veri').textContent = JSON.stringify({ gruplar: [{ ad: 'Deneme', ogeler: [{ ad: 'ikamet', href: adres }] }] });
          aramaBaslat(sahne);
          window.calisti = false;
          const girdi = document.getElementById('sorgu');
          let secim;
          girdi.addEventListener('trds:secildi', (olay) => { secim = olay.detail; });
          girdi.value = 'ikamet';
          girdi.dispatchEvent(new Event('input', { bubbles: true }));
          await bekle();
          const oneri = sahne.querySelector('[role="option"]');
          if (!oneri || oneri.dataset.href !== '') throw new Error('Güvensiz adres HTML içinde kaldı.');
          if (yol === 'klavye') {
            girdi.dispatchEvent(new KeyboardEvent('keydown', { key: 'ArrowDown', bubbles: true }));
            girdi.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter', bubbles: true }));
          } else {
            oneri.dispatchEvent(new MouseEvent('mousedown', { bubbles: true }));
          }
          await bekle();
          if (window.calisti || secim?.href !== '' || secim?.ad !== 'ikamet') throw new Error(`${dosya}: ${yol} güvenli değil.`);
          toplam++;
        }
      }
    }
    sonuc.textContent = `${toplam} test geçti. Normal ve küçültülmüş dosyalar, klavye ve fare seçiminde güvensiz adresleri reddetti.`;
    document.documentElement.dataset.sonuc = 'gecti';
  } catch (hata) {
    sonuc.textContent = `Test başarısız: ${hata.message}`;
    document.documentElement.dataset.sonuc = 'kaldi';
  }
</script>
</html>
